<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gametg-jumple</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0d0e12;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #181920;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Верхняя панель счета в игре */
    #top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 15px;
      font-weight: 700;
      z-index: 5;
    }
    .badge {
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Модальные окна */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(13, 14, 20, 0.94);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
    }
    .hidden { display: none !important; }

    /* Кнопка Поделиться (слева сверху) */
    .btn-share {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 30;
    }
    .btn-share:active { transform: scale(0.96); }

    /* Заголовки и текст */
    h1 { font-size: 30px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; color: #fff; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }
    h2 { font-size: 22px; margin-bottom: 6px; text-transform: uppercase; }
    p { font-size: 14px; color: #8f94a6; margin-bottom: 20px; }

    /* Большая центральная кнопка "Прыгать" */
    .btn-play {
      width: 220px;
      height: 65px;
      background: linear-gradient(135deg, #00a8ff, #0066cc);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 102, 204, 0.4);
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-play:active { transform: scale(0.96); }

    /* Нижний ряд кнопок меню (Рекорды и Магазин) */
    .menu-bottom-row {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }
    .btn-menu-sub {
      flex: 1;
      background: #1f222d;
      border: 1px solid #2d3242;
      color: #cbd0dc;
      padding: 12px 10px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-menu-sub:active { transform: scale(0.96); }

    /* Стандартные кнопки */
    .btn {
      width: 100%;
      max-width: 260px;
      background: #2481cc;
      color: #fff;
      border: none;
      padding: 13px 18px;
      margin: 6px 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #222530; color: #cbd0dc; border: 1px solid #2e3342; }

    /* Магазин */
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 290px;
      margin-bottom: 18px;
    }
    .skin-card {
      background: #1c1e27;
      border: 2px solid #2b2f3d;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .skin-card.active { border-color: #00a8ff; }
    .skin-preview { width: 34px; height: 34px; border-radius: 8px; }
    .skin-btn {
      width: 100%;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    /* Таблица рекордов */
    .leader-list {
      width: 100%;
      max-width: 290px;
      background: #1c1e27;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 18px;
      max-height: 250px;
      overflow-y: auto;
    }
    .leader-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #282c39;
      font-size: 13px;
    }
    .leader-row:last-child { border-bottom: none; }
    .leader-row.me { color: #00e5ff; font-weight: 700; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="game"></canvas>

  <!-- Верхняя строка во время прыжков -->
  <div id="top-bar">
    <div class="badge" id="hud-score">Счет: 0</div>
    <div class="badge" id="hud-coins">🪙 0</div>
  </div>

  <!-- Главное меню -->
  <div id="modal-menu" class="modal">
    <button class="btn-share" onclick="shareGame()">↗ Поделиться</button>

    <h1>JUMPLE</h1>
    <p id="menu-stats">Рекорд: 0 | Монеты: 0 🪙</p>

    <button class="btn-play" onclick="startGame()">
      <span>🚀</span> ПРЫГАТЬ
    </button>

    <div class="menu-bottom-row">
      <button class="btn-menu-sub" onclick="openLeaderboard()">🏆 Рекорды</button>
      <button class="btn-menu-sub" onclick="openShop()">🛍 Магазин</button>
    </div>
  </div>

  <!-- Экран Game Over -->
  <div id="modal-gameover" class="modal hidden">
    <h2>ПОРАЖЕНИЕ</h2>
    <p id="go-score">Счет: 0 | Рекорд: 0</p>
    <button class="btn" onclick="startGame()">Прыгать снова</button>
    <button class="btn btn-secondary" onclick="openShop()">🛍 Магазин</button>
    <button class="btn btn-secondary" onclick="openLeaderboard()">🏆 Рекорды</button>
    <button class="btn btn-secondary" onclick="openMenu()">В меню</button>
  </div>

  <!-- Окно магазина -->
  <div id="modal-shop" class="modal hidden">
    <h2>Магазин скинов</h2>
    <p>Баланс: <span id="shop-coins-val">0</span> 🪙</p>
    <div class="shop-grid" id="shop-items"></div>
    <button class="btn btn-secondary" onclick="openMenu()">Назад</button>
  </div>

  <!-- Окно рекордов -->
  <div id="modal-leaders" class="modal hidden">
    <h2>Топ игроков</h2>
    <p id="db-status">Загрузка...</p>
    <div class="leader-list" id="leader-board-items"></div>
    <button class="btn btn-secondary" onclick="openMenu()">Назад</button>
  </div>
</div>

<script>
  const DB_BASE_URL = "https://gametg-jumple-default-rtdb.firebaseio.com";

  // Инициализация Telegram Mini App
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const tgUser = {
    id: tg?.initDataUnsafe?.user?.id?.toString() || localStorage.getItem('gtj_guest_id') || 'u_' + Math.random().toString(36).substring(2, 9),
    name: tg?.initDataUnsafe?.user?.first_name || 'Прыгун'
  };
  localStorage.setItem('gtj_guest_id', tgUser.id);

  let highScore = parseInt(localStorage.getItem('gtj_highscore') || '0', 10);
  let totalCoins = parseInt(localStorage.getItem('gtj_coins') || '0', 10);
  let unlockedSkins = JSON.parse(localStorage.getItem('gtj_skins') || '["classic"]');
  let currentSkinId = localStorage.getItem('gtj_skin') || 'classic';

  const SKINS = [
    { id: 'classic', name: 'Классик', color: '#ff6b4a', price: 0 },
    { id: 'cyan',    name: 'Кибер',   color: '#00e5ff', price: 25 },
    { id: 'lime',    name: 'Эйсид',   color: '#76ff03', price: 60 },
    { id: 'gold',    name: 'Золото',  color: '#ffd700', price: 120 }
  ];

  function saveGameData() {
    localStorage.setItem('gtj_highscore', highScore.toString());
    localStorage.setItem('gtj_coins', totalCoins.toString());
    localStorage.setItem('gtj_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('gtj_skin', currentSkinId);
  }

  // Кнопка "Поделиться"
  function shareGame() {
    const text = `Я набрал ${highScore} очков в Gametg-jumple! Сможешь побить?`;
    const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`;
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(shareUrl);
    } else {
      window.open(shareUrl, '_blank');
    }
  }

  // Сохранение рекорда в базу данных
  async function pushGlobalScore(scoreVal) {
    try {
      const userUrl = `${DB_BASE_URL}/leaderboard/${tgUser.id}.json`;
      const res = await fetch(userUrl);
      const curr = await res.json();

      if (!curr || scoreVal > (curr.score || 0)) {
        await fetch(userUrl, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: tgUser.name,
            score: scoreVal,
            updatedAt: Date.now()
          })
        });
      }
    } catch (e) {
      console.error("Ошибка сохранения рекорда в БД:", e);
    }
  }

  // Холст и физика
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let width = Math.min(window.innerWidth, 420);
  let height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  const player = {
    x: width / 2 - 14,
    y: height - 140,
    w: 28,
    h: 28,
    vx: 0,
    vy: 0,
    jump: -10.6,
    gravity: 0.32
  };

  let score = 0;
  let moveDir = 0;
  let isPlaying = false;
  let platforms = [];
  const platWidth = 66;
  const platHeight = 12;
  const platCount = 7;

  function initPlatforms() {
    platforms = [];
    platforms.push({ x: width / 2 - platWidth / 2, y: height - 60, hasCoin: false, coinTaken: false });
    for (let i = 1; i < platCount; i++) {
      platforms.push({
        x: Math.random() * (width - platWidth),
        y: (height / platCount) * i,
        hasCoin: Math.random() < 0.35,
        coinTaken: false
      });
    }
  }

  function startGame() {
    closeModals();
    player.x = width / 2 - 14;
    player.y = height - 140;
    player.vx = 0;
    player.vy = player.jump;
    score = 0;
    initPlatforms();
    isPlaying = true;
    updateHUD();
  }

  function gameOver() {
    isPlaying = false;
    if (score > highScore) {
      highScore = score;
      pushGlobalScore(highScore);
    }
    saveGameData();

    document.getElementById('go-score').innerText = `Счет: ${score} | Ваш рекорд: ${highScore}`;
    document.getElementById('modal-gameover').classList.remove('hidden');
  }

  // Управление
  window.addEventListener('touchstart', (e) => {
    if (!isPlaying) return;
    const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
    moveDir = touchX < width / 2 ? -1 : 1;
  });

  window.addEventListener('touchend', () => {
    moveDir = 0;
  });

  function update() {
    if (!isPlaying) return;

    player.vx = moveDir * 5.4;
    player.x += player.vx;

    if (player.x > width) player.x = -player.w;
    if (player.x + player.w < 0) player.x = width;

    player.vy += player.gravity;
    player.y += player.vy;

    if (player.vy > 0) {
      platforms.forEach(p => {
        if (
          player.x + player.w > p.x &&
          player.x < p.x + platWidth &&
          player.y + player.h >= p.y &&
          player.y + player.h <= p.y + platHeight + player.vy
        ) {
          player.vy = player.jump;
        }
      });
    }

    platforms.forEach(p => {
      if (p.hasCoin && !p.coinTaken) {
        const coinX = p.x + platWidth / 2;
        const coinY = p.y - 14;
        if (
          player.x < coinX + 11 &&
          player.x + player.w > coinX - 11 &&
          player.y < coinY + 11 &&
          player.y + player.h > coinY - 11
        ) {
          p.coinTaken = true;
          totalCoins++;
          saveGameData();
          updateHUD();
        }
      }
    });

    if (player.y < height / 2) {
      const diff = height / 2 - player.y;
      player.y = height / 2;
      score += Math.floor(diff / 2);

      platforms.forEach(p => {
        p.y += diff;
        if (p.y > height) {
          p.y = 0;
          p.x = Math.random() * (width - platWidth);
          p.hasCoin = Math.random() < 0.35;
          p.coinTaken = false;
        }
      });
      updateHUD();
    }

    if (player.y > height) {
      gameOver();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    // Платформы
    platforms.forEach(p => {
      ctx.fillStyle = '#3a8854';
      ctx.fillRect(p.x, p.y, platWidth, platHeight);

      if (p.hasCoin && !p.coinTaken) {
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(p.x + platWidth / 2, p.y - 9, 6.5, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Персонаж
    const activeSkin = SKINS.find(s => s.id === currentSkinId) || SKINS[0];
    ctx.fillStyle = activeSkin.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Глаза
    ctx.fillStyle = '#fff';
    const eyeOffset = moveDir < 0 ? 3 : (moveDir > 0 ? 15 : 9);
    ctx.fillRect(player.x + eyeOffset, player.y + 6, 4, 6);
    ctx.fillRect(player.x + eyeOffset + 7, player.y + 6, 4, 6);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function updateHUD() {
    document.getElementById('hud-score').innerText = `Счет: ${score}`;
    document.getElementById('hud-coins').innerText = `🪙 ${totalCoins}`;
  }

  // Навигация
  function closeModals() {
    document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden'));
  }

  function openMenu() {
    isPlaying = false;
    closeModals();
    document.getElementById('menu-stats').innerText = `Рекорд: ${highScore} | Монеты: ${totalCoins} 🪙`;
    document.getElementById('modal-menu').classList.remove('hidden');
    updateHUD();
  }

  function openShop() {
    closeModals();
    document.getElementById('shop-coins-val').innerText = totalCoins;
    const container = document.getElementById('shop-items');
    container.innerHTML = '';

    SKINS.forEach(skin => {
      const isUnlocked = unlockedSkins.includes(skin.id);
      const isEquipped = currentSkinId === skin.id;

      const card = document.createElement('div');
      card.className = `skin-card ${isEquipped ? 'active' : ''}`;
      card.innerHTML = `
        <div class="skin-preview" style="background:${skin.color};"></div>
        <div style="font-size:12px;font-weight:600;">${skin.name}</div>
        <button class="skin-btn" style="background:${isEquipped ? '#00a8ff' : '#2b303e'};color:#fff;">
          ${isEquipped ? 'Надет' : (isUnlocked ? 'Выбрать' : `🪙 ${skin.price}`)}
        </button>
      `;

      card.querySelector('button').onclick = () => {
        if (isEquipped) return;
        if (isUnlocked) {
          currentSkinId = skin.id;
        } else if (totalCoins >= skin.price) {
          totalCoins -= skin.price;
          unlockedSkins.push(skin.id);
          currentSkinId = skin.id;
        } else {
          alert('Не хватает монет!');
          return;
        }
        saveGameData();
        openShop();
        updateHUD();
      };

      container.appendChild(card);
    });

    document.getElementById('modal-shop').classList.remove('hidden');
  }

  async function openLeaderboard() {
    closeModals();
    const board = document.getElementById('leader-board-items');
    const statusText = document.getElementById('db-status');
    board.innerHTML = '';
    statusText.innerText = 'Загрузка с сервера...';
    document.getElementById('modal-leaders').classList.remove('hidden');

    try {
      const res = await fetch(`${DB_BASE_URL}/leaderboard.json`);
      const data = await res.json();

      statusText.innerText = 'Топ-10 игроков мира';

      if (!data) {
        board.innerHTML = '<div style="padding:10px;color:#777;">Пока нет рекордов</div>';
        return;
      }

      const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      list.sort((a, b) => (b.score || 0) - (a.score || 0));
      const top10 = list.slice(0, 10);

      top10.forEach((item, idx) => {
        const row = document.createElement('div');
        const isMe = item.id === tgUser.id;
        row.className = `leader-row ${isMe ? 'me' : ''}`;
        row.innerHTML = `<span>#${idx + 1} ${item.name || 'Игрок'} ${isMe ? '(Вы)' : ''}</span><span>${item.score || 0}</span>`;
        board.appendChild(row);
      });
    } catch (err) {
      statusText.innerText = 'Ошибка подключения к базе';
      console.error(err);
    }
  }

  // Генерация стартовых платформ для заднего фона меню и запуск цикла
  initPlatforms();
  openMenu();
  loop();
</script>
</body>
</html>
